<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Space </title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #0a0a1f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    .space-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 20% 30%, #1a1a3e, #050510 80%);
      overflow: hidden;
    }

    .space-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 10% 20%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 25% 70%, #fff, rgba(0,0,0,0)),
        radial-gradient(3px 3px at 50% 40%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 70% 80%, #fff, rgba(0,0,0,0)),
        radial-gradient(4px 4px at 85% 15%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 92% 60%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 15% 90%, #fff, rgba(0,0,0,0)),
        radial-gradient(3px 3px at 65% 10%, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40% 95%, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 78% 45%, #fff, rgba(0,0,0,0));
      background-size: 200px 200px;
      background-repeat: repeat;
      opacity: 0.9;
      animation: twinkle 4s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .space-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 50%, rgba(100, 70, 255, 0.15), transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(255, 100, 200, 0.1), transparent 50%);
      pointer-events: none;
    }
    #effect-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }
    .click-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      cursor: crosshair;
    }
    .menu-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 20;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(20, 20, 50, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(120, 80, 255, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.3s;
      line-height: 1;
    }

    .menu-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #8a6eff, inset 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .menu-btn:active {
      transform: scale(0.95);
    }
    .menu-panel {
      position: fixed;
      top: 90px;
      right: 24px;
      z-index: 25;
      width: 300px;
      max-height: 70vh;
      background: rgba(12, 12, 30, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(180, 160, 255, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 60px rgba(100, 70, 255, 0.3);
      padding: 18px 12px 18px 18px;
      color: #eee;
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .menu-panel.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-right: 6px;
    }

    .menu-header h3 {
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 18px;
      background: linear-gradient(90deg, #c1b0ff, #7aa2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ccc;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 80, 80, 0.3);
      color: white;
      transform: rotate(90deg);
    }
    .tab-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding-right: 8px;
      scrollbar-width: thin;
      scrollbar-color: #6a5acd transparent;
    }

    .tab-list::-webkit-scrollbar {
      width: 5px;
    }

    .tab-list::-webkit-scrollbar-thumb {
      background: #6a5acd;
      border-radius: 10px;
    }

    .tab-item {
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border-left: 4px solid transparent;
      cursor: pointer;
      transition: 0.2s;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
      letter-spacing: 0.3px;
    }

    .tab-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .tab-item.active {
      background: rgba(130, 100, 255, 0.25);
      border-left-color: #a88bff;
      color: white;
      box-shadow: 0 0 20px rgba(130, 100, 255, 0.3);
    }

    .tab-item .emoji {
      font-size: 20px;
      width: 28px;
      text-align: center;
    }

    .tab-item .label {
      flex: 1;
    }
    .hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 13px;
      z-index: 15;
      pointer-events: none;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="space-bg"></div>
  <canvas id="effect-canvas"></canvas>
  <div class="click-layer" id="clickLayer"></div>
  <button class="menu-btn" id="menuBtn" aria-label="Mở menu hiệu ứng">✨</button>
  <div class="menu-panel" id="menuPanel">
    <div class="menu-header">
      <h3>HIỆU ỨNG</h3>
      <button class="close-btn" id="closeBtn" aria-label="Đóng menu">✕</button>
    </div>
    <div class="tab-list" id="tabList">
    </div>
  </div>

  <div class="hint">tiktok : @px_rbx</div>

  <script>
    (function() {
      const canvas = document.getElementById('effect-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;

      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
      }
      window.addEventListener('resize', resize);
      resize();

      // ---------- MẢNG HIỆU ỨNG ----------
      const effectsList = [
        { id: 'spark-curve', name: 'Tia sáng cong', emoji: '🌀', fn: effectSparkCurve },
        { id: 'firework-text', name: 'Pháo hoa chữ', emoji: '🎆', fn: effectFireworkText },
        { id: 'water-drop', name: 'Giọt nước', emoji: '💧', fn: effectWaterDrop },
        { id: 'star-burst', name: 'Sao băng', emoji: '⭐', fn: effectStarBurst },
        { id: 'ring-pulse', name: 'Vòng xung', emoji: '🔵', fn: effectRingPulse },
        { id: 'confetti', name: 'Kim tuyến', emoji: '🎊', fn: effectConfetti },
        { id: 'lightning', name: 'Tia chớp', emoji: '⚡', fn: effectLightning },
        { id: 'bubble', name: 'Bong bóng', emoji: '🫧', fn: effectBubble },
        { id: 'heart', name: 'Trái tim', emoji: '❤️', fn: effectHeart },
        { id: 'spiral', name: 'Xoáy ốc', emoji: '🌀', fn: effectSpiral }
      ];
      let particles = [];
      let animationFrame = null;
      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw(ctx);
          if (p.dead) {
            particles.splice(i, 1);
          }
        }
        if (particles.length > 0) {
          animationFrame = requestAnimationFrame(draw);
        } else {
          animationFrame = null;
        }
      }

      function startLoop() {
        if (!animationFrame) {
          animationFrame = requestAnimationFrame(draw);
        }
      }
      class Particle {
        constructor(x, y, vx, vy, life, size, color, shape = 'circle', extra = {}) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.life = life;
          this.age = 0;
          this.size = size;
          this.color = color;
          this.shape = shape;
          this.extra = extra;
          this.dead = false;
          this.rotation = extra.rotation || 0;
          this.rotSpeed = extra.rotSpeed || 0;
          this.gravity = extra.gravity || 0;
          this.friction = extra.friction !== undefined ? extra.friction : 0.98;
          this.text = extra.text || '';
          this.font = extra.font || '20px sans-serif';
          this.alpha = 1;
        }

        update() {
          this.age += 1/60;
          if (this.age >= this.life) {
            this.dead = true;
            return;
          }
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.rotation += this.rotSpeed;
          this.alpha = 1 - (this.age / this.life);
          if (this.x < -100 || this.x > w + 100 || this.y < -100 || this.y > h + 100) {
            this.dead = true;
          }
        }

        draw(ctx) {
          if (this.dead) return;
          ctx.save();
          ctx.globalAlpha = this.alpha;

          if (this.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * (1 - this.age / this.life * 0.5), 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 15;
            ctx.fill();
          } else if (this.shape === 'line') {
            const len = this.size * (1 - this.age / this.life);
            const angle = Math.atan2(this.vy, this.vx);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - Math.cos(angle) * len, this.y - Math.sin(angle) * len);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2.5 * (1 - this.age / this.life);
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 12;
            ctx.stroke();
          } else if (this.shape === 'text') {
            ctx.font = this.font;
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 16;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillText(this.text, 0, 0);
          } else if (this.shape === 'spark') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.vx * 3, this.y + this.vy * 3);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          ctx.restore();
        }
      }

      // ---------- CÁC HÀM HIỆU ỨNG ----------

      // 1. Tia sáng cong (dùng nét cong)
      function effectSparkCurve(x, y) {
        const count = 18;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
          const speed = 2.5 + Math.random() * 3;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const hue = 200 + Math.random() * 100;
          const color = `hsl(${hue}, 100%, 70%)`;
          // Particle dạng line với cong nhẹ (thêm rotSpeed)
          const p = new Particle(x, y, vx, vy, 1.0 + Math.random() * 0.5, 22, color, 'line', {
            rotSpeed: (Math.random() - 0.5) * 0.2,
            friction: 0.96,
            gravity: 0.02
          });
          particles.push(p);
        }
        // thêm vài tia sáng trắng
        for (let i = 0; i < 8; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 2;
          particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 0.8, 3, '#ffffff', 'spark', {
            friction: 0.97
          }));
        }
        startLoop();
      }

      // 2. Pháo hoa chữ (dùng văn bản tỏa ra)
      function effectFireworkText(x, y) {
        const chars = ['✦', '⭐', '💫', '⚡', '🔥'];
        const count = 28;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
          const speed = 2 + Math.random() * 4;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const hue = Math.random() * 360;
          const char = chars[Math.floor(Math.random() * chars.length)];
          const p = new Particle(x, y, vx, vy, 1.2 + Math.random() * 0.8, 18 + Math.random() * 14, `hsl(${hue}, 100%, 70%)`, 'text', {
            text: char,
            font: 'bold 22px "Segoe UI", sans-serif',
            rotSpeed: (Math.random() - 0.5) * 0.1,
            friction: 0.97,
            gravity: 0.04
          });
          particles.push(p);
        }
        // Thêm trung tâm sáng
        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 2;
          particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 0.9, 5, '#ffffff', 'circle', {
            friction: 0.95
          }));
        }
        startLoop();
      }

      // 3. Giọt nước
      function effectWaterDrop(x, y) {
        const count = 16;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const speed = 1.5 + Math.random() * 3;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const blueHue = 190 + Math.random() * 40;
          const color = `hsl(${blueHue}, 90%, 65%)`;
          // Hình tròn dẹt? dùng circle với size nhỏ
          const p = new Particle(x, y, vx, vy, 1.0 + Math.random() * 0.6, 6 + Math.random() * 6, color, 'circle', {
            gravity: 0.15,
            friction: 0.98,
            rotSpeed: 0
          });
          particles.push(p);
        }
        // thêm các giọt trong suốt
        for (let i = 0; i < 12; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.8 + Math.random() * 2.5;
          particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 0.9, 4 + Math.random() * 6, 'rgba(180, 230, 255, 0.9)', 'circle', {
            gravity: 0.1,
            friction: 0.97
          }));
        }
        startLoop();
      }

      // 4. Sao băng (star burst)
      function effectStarBurst(x, y) {
        const count = 30;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 5;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const hue = 50 + Math.random() * 30; // vàng cam
          const size = 2 + Math.random() * 4;
          particles.push(new Particle(x, y, vx, vy, 0.8 + Math.random() * 0.7, size, `hsl(${hue}, 100%, 70%)`, 'circle', {
            friction: 0.96,
            gravity: 0.02
          }));
        }
        // thêm tia sáng
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const speed = 4;
          particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 0.6, 18, '#fff9c4', 'line', {
            friction: 0.95
          }));
        }
        startLoop();
      }

      // 5. Vòng xung (ring pulse)
      function effectRingPulse(x, y) {
        const rings = 6;
        for (let r = 0; r < rings; r++) {
          const delay = r * 0.05; // không có delay thực, nhưng tạo size khác nhau
          const hue = 260 + r * 15;
          const color = `hsl(${hue}, 90%, 70%)`;
          const count = 14 + r * 4;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const speed = 1.5 + r * 1.2 + Math.random() * 0.8;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const size = 2 + Math.random() * 3;
            const p = new Particle(x, y, vx, vy, 0.9, size, color, 'circle', {
              friction: 0.96,
              gravity: 0.01
            });
            particles.push(p);
          }
        }
        startLoop();
      }

      // 6. Kim tuyến (confetti)
      function effectConfetti(x, y) {
        const count = 45;
        const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590', '#9c89b8'];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed - 1;
          const color = colors[Math.floor(Math.random() * colors.length)];
          const size = 5 + Math.random() * 8;
          const p = new Particle(x, y, vx, vy, 1.5 + Math.random() * 0.8, size, color, 'circle', {
            gravity: 0.12,
            friction: 0.98,
            rotSpeed: (Math.random() - 0.5) * 0.3
          });
          p.shape = 'text';
          p.text = '■';
          p.font = `${size}px sans-serif`;
          particles.push(p);
        }
        startLoop();
      }

      // 7. Tia chớp (lightning)
      function effectLightning(x, y) {
        const branches = 8;
        for (let b = 0; b < branches; b++) {
          const baseAngle = (b / branches) * Math.PI * 2;
          const segments = 5 + Math.floor(Math.random() * 4);
          for (let s = 0; s < segments; s++) {
            const angle = baseAngle + (Math.random() - 0.5) * 0.8;
            const speed = 3 + Math.random() * 5;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const size = 10 + Math.random() * 15;
            const hue = 60;
            const color = `hsl(${hue}, 100%, 75%)`;
            const p = new Particle(x, y, vx, vy, 0.5 + Math.random() * 0.3, size, color, 'line', {
              friction: 0.94,
              gravity: 0.0
            });
            particles.push(p);
          }
        }
        // thêm tia trắng
        for (let i = 0; i < 10; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 6 + Math.random() * 8;
          particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 0.4, 4, '#ffffff', 'line', {
            friction: 0.92
          }));
        }
        startLoop();
      }

      // 8. Bong bóng (bubble)
      function effectBubble(x, y) {
        const count = 18;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 4;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed - 1.5; // bay lên
          const size = 8 + Math.random() * 18;
          const hue = 180 + Math.random() * 60;
          const color = `hsla(${hue}, 80%, 75%, 0.8)`;
          const p = new Particle(x, y, vx, vy, 1.8 + Math.random() * 1.2, size, color, 'circle', {
            gravity: -0.02,
            friction: 0.99
          });
          particles.push(p);
        }
        for (let i = 0; i < 8; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.5 + Math.random() * 2;
          particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - 1, 2.0, 10 + Math.random() * 20, 'rgba(255,255,255,0.5)', 'circle', {
            gravity: -0.01,
            friction: 0.99
          }));
        }
        startLoop();
      }

      // 9. Trái tim
      function effectHeart(x, y) {
        const count = 24;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const speed = 1.5 + Math.random() * 4;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const hue = 340 + Math.random() * 20;
          const color = `hsl(${hue}, 90%, 65%)`;
          const size = 12 + Math.random() * 14;
          const p = new Particle(x, y, vx, vy, 1.3 + Math.random() * 0.6, size, color, 'text', {
            text: '❤️',
            font: `${size}px "Segoe UI", sans-serif`,
            rotSpeed: (Math.random() - 0.5) * 0.1,
            friction: 0.97,
            gravity: 0.05
          });
          particles.push(p);
        }
        startLoop();
      }

      // 10. Xoáy ốc (spiral)
      function effectSpiral(x, y) {
        const arms = 3;
        const particlesPerArm = 20;
        for (let a = 0; a < arms; a++) {
          const baseAngle = (a / arms) * Math.PI * 2;
          for (let i = 0; i < particlesPerArm; i++) {
            const t = i / particlesPerArm;
            const angle = baseAngle + t * 6;
            const speed = 1.5 + t * 4;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const hue = 200 + a * 40 + t * 60;
            const color = `hsl(${hue}, 90%, 70%)`;
            const size = 3 + Math.random() * 5;
            const p = new Particle(x, y, vx, vy, 1.0 + t * 0.6, size, color, 'circle', {
              friction: 0.97,
              gravity: 0.0
            });
            particles.push(p);
          }
        }
        startLoop();
      }
      let currentEffectFn = effectSparkCurve;

      // ---------- XỬ LÝ CLICK ----------
      const clickLayer = document.getElementById('clickLayer');
      clickLayer.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        currentEffectFn(x, y);
      });

      // ---------- MENU TAB UI ----------
      const menuBtn = document.getElementById('menuBtn');
      const menuPanel = document.getElementById('menuPanel');
      const closeBtn = document.getElementById('closeBtn');
      const tabList = document.getElementById('tabList');

      let activeTabId = effectsList[0].id;

      // Tạo tabs
      function renderTabs() {
        tabList.innerHTML = '';
        effectsList.forEach(effect => {
          const div = document.createElement('div');
          div.className = `tab-item ${effect.id === activeTabId ? 'active' : ''}`;
          div.dataset.id = effect.id;
          div.innerHTML = `<span class="emoji">${effect.emoji}</span><span class="label">${effect.name}</span>`;
          div.addEventListener('click', () => {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            div.classList.add('active');
            activeTabId = effect.id;
            currentEffectFn = effect.fn;
          });
          tabList.appendChild(div);
        });
      }

      renderTabs();

      // Mở/đóng menu
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuPanel.classList.toggle('open');
      });

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuPanel.classList.remove('open');
      });
      document.addEventListener('click', (e) => {
        if (menuPanel.classList.contains('open') && !menuPanel.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
          menuPanel.classList.remove('open');
        }
      });
      menuPanel.addEventListener('click', (e) => e.stopPropagation());
      window.addEventListener('resize', () => {
        particles = [];
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        ctx.clearRect(0, 0, w, h);
      });

    })();
  </script>
</body>
</html>
